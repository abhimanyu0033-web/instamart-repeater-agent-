name: Run Instamart Repeater Agent

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Swiggy Auth Code (from localhost redirect URL)'
        required: false
        default: ''
      code_verifier:
        description: 'PKCE Code Verifier (from previous log)'
        required: false
        default: ''

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mcp httpx

      - name: Run Repeater Agent
        env:
          SWIGGY_TOKEN: ${{ secrets.SWIGGY_TOKEN }}
          AUTH_CODE: ${{ github.event.inputs.auth_code }}
          CODE_VERIFIER: ${{ github.event.inputs.code_verifier }}
        run: |
          python agent.py
