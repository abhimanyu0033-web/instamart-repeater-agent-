name: Run Instamart Repeater Agent

on:
  workflow_dispatch: # Allows manual one-tap trigger from phone

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mcp httpx

      - name: Run Repeater Agent
        run: |
          python agent.py
